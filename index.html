<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn The Ships — Start</title>
<style>
:root {
  --bg:#071b1a; --panel:#0d2927; --panel2:#123431;
  --gold:#d6ad55; --cream:#f4ead3; --muted:#aabbb5;
  --line:rgba(214,173,85,.28); --hover:#19433e;
}
* {box-sizing:border-box}
body {
  margin:0; min-height:100vh; color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 50% 5%,rgba(214,173,85,.10),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(25,67,62,.28),transparent 35%),
    var(--bg);
  padding:30px 22px 40px;
}
.container {width:min(1050px,100%);margin:auto}
header {text-align:center}
.logo {
  display:block; width:min(250px,48vw); max-height:300px;
  object-fit:contain; margin:0 auto 4px;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.38));
}
.brand {
  margin:0; font-size:clamp(30px,5vw,50px); letter-spacing:3px;
  text-transform:uppercase;
}
.tagline {
  color:var(--gold); letter-spacing:5px; text-transform:uppercase;
  font:13px Arial,sans-serif; margin-top:9px;
}
.ship-line {width:180px;height:1px;background:var(--gold);opacity:.55;margin:18px auto}
.clock {text-align:center;color:var(--muted);font:14px Arial,sans-serif;margin:12px 0 25px}
.search {display:flex;gap:10px;max-width:760px;margin:0 auto 36px}
.search input {
  flex:1;padding:17px 21px;border-radius:12px;border:1px solid var(--line);
  background:rgba(13,41,39,.94);color:var(--cream);font:17px Arial,sans-serif;outline:none
}
.search input:focus {border-color:var(--gold)}
.search button {
  padding:0 23px;border:0;border-radius:12px;background:var(--gold);
  color:#16231f;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif
}
.section-title {
  font-size:19px;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);margin:0 0 14px
}
.grid {
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px
}
.tile {
  text-decoration:none;color:var(--cream);
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:20px;
  min-height:108px;display:flex;flex-direction:column;justify-content:center;
  transition:.15s ease
}
.tile:hover {transform:translateY(-3px);background:var(--hover);border-color:rgba(214,173,85,.7)}
.icon {font:25px Arial,sans-serif;margin-bottom:9px}
.tile-name {font-size:18px;font-weight:bold}
.tile-url {color:var(--muted);font:11px Arial,sans-serif;margin-top:5px}
footer {text-align:center;color:var(--muted);font:11px Arial,sans-serif;margin-top:30px;opacity:.7}
@media(max-width:700px) {
  body{padding:20px 14px 30px}
  .search button{padding:0 17px}
  .logo{width:min(220px,60vw)}
}
</style>
</head>
